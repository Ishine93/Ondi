<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Débrideur</title>
<style>
  /* Mise en page pensée pour 1920 px de large (comme l'application Samsung), réduite à l'écran : 1rem = 10 px à 1920. */
  html { font-size: calc(100vw / 192); }
  html, body { margin: 0; height: 100%; background: #0b1118; color: #f2f5f8; font-family: "Roboto", "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #ecran { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(140rem 80rem at 50% -10%, #1d3550 0%, #0b1118 62%); }
  .boite { display: flex; flex-direction: column; align-items: center; width: 110rem; }
  .boite > * + * { margin-top: 2.8rem; }
  .logo { display: flex; align-items: center; font-size: 5.2rem; font-weight: 800; }
  .logo svg { width: 8rem; height: 8rem; margin-right: 1.8rem; }
  h1 { font-size: 4.6rem; margin: 0; }
  p { font-size: 2.8rem; color: #b9c5d2; margin: 0; line-height: 1.45; }
  .rond { width: 7rem; height: 7rem; box-sizing: border-box; border-radius: 50%; border: 0.7rem solid rgba(255,255,255,.19); border-top-color: #fff; animation: t 1s linear infinite; margin: 0 auto 2.6rem; }
  @keyframes t { to { transform: rotate(360deg); } }
  .champ { font: inherit; font-size: 3.4rem; padding: 1.8rem 2.4rem; border-radius: 1.4rem; border: 0.2rem solid #263443; background: #0b1118; color: #fff; width: 64rem; text-align: center; box-sizing: border-box; }
  .boutons { display: flex; justify-content: center; margin-top: 2.8rem; }
  .boutons button + button { margin-left: 2.2rem; }
  button { font: inherit; font-size: 3rem; font-weight: 700; padding: 1.8rem 4rem; border-radius: 1.4rem; border: 0.2rem solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #fff; }
  button.principal { background: #1a98ff; border-color: #1a98ff; }
  button:focus, .champ:focus { outline: 0.5rem solid #fff; outline-offset: 0.4rem; }
  code { color: #8ccaff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="ecran">
  <div class="boite">
    <div class="logo">
      <svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58b9ff"/><stop offset="1" stop-color="#1a6dff"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M16 7v13m-6-6 6 6 6-6M9 25h14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Débrideur
    </div>
    <div id="attente">
      <div class="rond"></div>
      <p id="etape">Connexion au serveur…</p>
    </div>
    <div id="reglage" hidden>
      <h1 id="titreReglage">Serveur introuvable</h1>
      <p id="aideReglage" style="margin: 1.8rem 0 2.6rem">Le PC (ou le mini-PC) du Débrideur est-il allumé ? Son adresse s'affiche en bas de la page du Débrideur, par exemple <code>192.168.1.50:8097</code>.</p>
      <input id="adresse" class="champ" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.50:8097">
      <div class="boutons">
        <button id="connecter" class="principal">Se connecter</button>
        <button id="chercher">Chercher sur le réseau</button>
      </div>
    </div>
  </div>
</div>
<script>
// Lanceur de l'application Android TV / Fire TV : trouve le serveur (adresse gardée, sinon recherche sur le
// réseau de la télé), puis ouvre la page du Débrideur dans cette même vue. « ?reglage=1 » : choix du serveur.
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var appli = window.DebrideurAppli || null; // fourni par l'application (absent dans un navigateur)
  var serveur = '';
  var anglais = !/^fr/i.test(navigator.language || '');
  var reglageDemande = /[?&]reglage=1/.test(location.search);
  if (anglais) {
    document.documentElement.lang = 'en';
    $('#etape').textContent = 'Connecting to the server…';
    $('#titreReglage').textContent = 'Server not found';
    $('#aideReglage').innerHTML = 'Is the Débrideur PC (or mini-PC) on? Its address is shown at the bottom of the Débrideur page, e.g. <code>192.168.1.50:8097</code>.';
    $('#connecter').textContent = 'Connect';
    $('#chercher').textContent = 'Search the network';
  }

  var appel = function (nom, defaut) {
    try { return appli && appli[nom] ? String(appli[nom]()) : defaut; } catch (e) { return defaut; }
  };
  var lire = function () {
    if (appli && appli.serveur) return appel('serveur', '');
    try { return localStorage.getItem('serveur') || ''; } catch (e) { return ''; }
  };
  var ecrire = function (v) {
    try { if (appli && appli.garderServeur) appli.garderServeur(v); } catch (e) {}
    try { localStorage.setItem('serveur', v); } catch (e) {}
  };
  var normaliser = function (a) {
    a = String(a || '').replace(/\s+/g, '').replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
    if (!a) return '';
    return /:\d+$/.test(a) ? a : a + ':8097';
  };

  function ping(adresse, delai) {
    return new Promise(function (ok) {
      var x = new XMLHttpRequest();
      var fini = false;
      var fin = function (v) { if (!fini) { fini = true; ok(v); } };
      try {
        x.open('GET', 'http://' + adresse + '/api/ping', true);
        x.timeout = delai || 2500;
        x.onload = function () { try { fin(JSON.parse(x.responseText).app === 'debrideur'); } catch (e) { fin(false); } };
        x.onerror = x.ontimeout = function () { fin(false); };
        x.send();
      } catch (e) { fin(false); }
      setTimeout(function () { fin(false); }, (delai || 2500) + 1000); // filet si le navigateur ne signale rien
    });
  }

  function chercherSurReseau() {
    montrerAttente(anglais ? 'Searching the network…' : 'Recherche sur le réseau…');
    var ip = appel('ip', '');
    var base = (/^\d+\.\d+\.\d+\.\d+$/.test(ip) ? ip : '192.168.1.1').split('.').slice(0, 3).join('.');
    var candidats = [];
    for (var i = 1; i < 255; i++) candidats.push(base + '.' + i + ':8097');
    // Par paquets de 32 : la première adresse qui répond « debrideur » gagne.
    var trouve = '';
    var paquet = function (debut) {
      if (trouve || debut >= candidats.length) return Promise.resolve(trouve);
      var lot = candidats.slice(debut, debut + 32);
      return Promise.all(lot.map(function (a) { return ping(a, 1500).then(function (oui) { if (oui && !trouve) trouve = a; }); }))
        .then(function () { return paquet(debut + 32); });
    };
    return paquet(0);
  }

  function montrerAttente(texte) {
    $('#attente').hidden = false;
    $('#reglage').hidden = true;
    $('#etape').textContent = texte;
  }
  function montrerReglage() {
    $('#attente').hidden = true;
    $('#reglage').hidden = false;
    $('#adresse').value = serveur || lire();
    $('#connecter').focus();
  }
  function ouvrir(adresse) {
    serveur = adresse;
    ecrire(adresse);
    var version = appel('plateforme', 'android') + '-' + appel('version', '');
    // replace : le lanceur ne reste pas dans l'historique de la vue.
    location.replace('http://' + adresse + '/?tele=1&appli=' + encodeURIComponent(version));
  }

  function demarrer() {
    var gardee = normaliser(lire());
    montrerAttente(anglais ? 'Connecting to the server…' : 'Connexion au serveur…');
    var chercher = function () {
      chercherSurReseau().then(function (a) { if (a) ouvrir(a); else montrerReglage(); });
    };
    if (!gardee) return chercher();
    ping(gardee).then(function (oui) { if (oui) ouvrir(gardee); else chercher(); });
  }

  function connecter() {
    var a = normaliser($('#adresse').value);
    if (!a) return ouvrirClavier();
    montrerAttente((anglais ? 'Connecting to ' : 'Connexion à ') + a + '…');
    ping(a, 4000).then(function (oui) { if (oui) ouvrir(a); else montrerReglage(); });
  }
  function ouvrirClavier() {
    $('#adresse').focus();
    try { if (appli && appli.clavier) appli.clavier(); } catch (e) {}
  }

  $('#connecter').addEventListener('click', connecter);
  $('#chercher').addEventListener('click', function () {
    chercherSurReseau().then(function (a) { if (a) ouvrir(a); else montrerReglage(); });
  });
  // Le champ prend la main (flèche haut) : le clavier de la télé s'ouvre.
  $('#adresse').addEventListener('focus', function () {
    try { if (appli && appli.clavier) appli.clavier(); } catch (e) {}
  });

  var quitter = function () {
    try { if (appli && appli.quitter) appli.quitter(); } catch (e) {}
  };

  // Télécommande : Retour (envoyé par l'application comme « GoBack »), flèches et OK sur l'écran de réglage.
  document.addEventListener('keydown', function (e) {
    var cle = e.key;
    var code = e.keyCode;
    var actif = document.activeElement;
    var reglageVisible = !$('#reglage').hidden;
    if (cle === 'GoBack' || cle === 'Escape' || cle === 'BrowserBack' || code === 27) {
      e.preventDefault();
      // Écran de réglage avec un serveur connu : on y retourne. Sinon on quitte (comme sur Samsung).
      if (serveur && reglageVisible) return ouvrir(serveur);
      return quitter();
    }
    if (!reglageVisible) return;
    if (cle === 'ArrowLeft' || cle === 'ArrowRight') {
      if (actif === $('#adresse')) return; // déplace le curseur dans le champ
      e.preventDefault();
      if (actif === $('#connecter') && cle === 'ArrowRight') $('#chercher').focus();
      else if (actif === $('#chercher') && cle === 'ArrowLeft') $('#connecter').focus();
      else if (actif !== $('#connecter') && actif !== $('#chercher')) $('#connecter').focus();
    } else if (cle === 'ArrowUp') {
      e.preventDefault();
      $('#adresse').focus();
    } else if (cle === 'ArrowDown') {
      e.preventDefault();
      if (actif === $('#adresse') || (actif !== $('#connecter') && actif !== $('#chercher'))) $('#connecter').focus();
    } else if (cle === 'Enter' || code === 13 || code === 23) {
      e.preventDefault();
      if (actif === $('#adresse') || actif === $('#connecter')) connecter();
      else if (actif === $('#chercher')) $('#chercher').click();
      else $('#connecter').focus();
    }
  });

  // Venu de la page du Débrideur (« changer de serveur ») : Retour y ramène.
  if (reglageDemande) {
    serveur = normaliser(lire());
    montrerReglage();
  } else demarrer();
})();
</script>
</body>
</html>
