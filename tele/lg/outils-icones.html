<!doctype html><html><head><meta charset="utf-8">
<!-- Modèle des images de l'appli LG (app/icon.png 80×80, app/largeIcon.png 130×130, app/splash.png 1920×1080),
     photographié par Chrome sans fenêtre. Chrome refuse les fenêtres de moins de 500 px : les icônes sont
     dessinées en grand puis réduites par --force-device-scale-factor.
       chrome --headless=new --disable-gpu --hide-scrollbars --window-size=800,800 --force-device-scale-factor=0.1 --screenshot=app\icon.png file:///…/outils-icones.html
       chrome --headless=new --disable-gpu --hide-scrollbars --window-size=650,650 --force-device-scale-factor=0.2 --screenshot=app\largeIcon.png file:///…/outils-icones.html
       chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1920,1080 --screenshot=app\splash.png "file:///…/outils-icones.html?splash" -->
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;color:#f2f5f8;font-family:"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(80vmax 65vmax at 30% 20%,#1d4a74 0%,#0b1118 70%)}
.c{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
svg{width:74vmin;height:74vmin;filter:drop-shadow(0 3vmin 6vmin #000a)}
.nom{display:none;font-size:104px;font-weight:800;margin-left:36px}
.splash{background:radial-gradient(1400px 800px at 50% -10%,#1d3550 0%,#0b1118 62%)}
.splash svg{width:160px;height:160px;filter:none}
.splash .nom{display:block}
</style></head><body><div class="c"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58b9ff"/><stop offset="1" stop-color="#1a6dff"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M16 7v13m-6-6 6 6 6-6M9 25h14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="nom">Débrideur</div></div>
<script>if (/splash/.test(location.search)) document.body.className = 'splash';</script>
</body></html>
